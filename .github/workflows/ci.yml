name: Flask API CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Run Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Tests
        run: python -m unittest -v test_app.py

  docker:
    name: Build and Push Docker Image
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log In to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/devops-flask:latest

  deploy:
    name: Deploy to AWS EC2 via Systems Manager
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Configure AWS Credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::106834399220:role/GitHubActions-SSM-Deploy-Role
          aws-region: ap-south-1

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      - name: Deploy Application through Systems Manager
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$INSTANCE_ID" || -z "$DOCKERHUB_USERNAME" ]]; then
            echo "Required GitHub variable or secret is missing."
            exit 1
          fi

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Flask API from GitHub Actions" \
            --parameters "$(jq -n \
              --arg username "$DOCKERHUB_USERNAME" \
              '{
                commands: [
                  "set -e",
                  ("sudo docker pull " + $username + "/devops-flask:latest"),
                  "sudo docker stop devops-flask-container || true",
                  "sudo docker rm devops-flask-container || true",
                  ("sudo docker run -d --name devops-flask-container --restart unless-stopped -p 80:5001 " + $username + "/devops-flask:latest"),
                  "curl --retry 5 --retry-delay 2 --retry-connrefused -fsS http://localhost/health"
                ]
              }')" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM command ID: $COMMAND_ID"

          for attempt in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null || true)

            echo "Deployment status: ${STATUS:-Pending}"

            case "$STATUS" in
              Success)
                echo "Deployment succeeded."
                exit 0
                ;;
              Failed|Cancelled|TimedOut)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query '{Status:Status,Error:ErrorDetails,Output:StandardOutputContent,Errors:StandardErrorContent}' \
                  --output json
                exit 1
                ;;
            esac

            sleep 5
          done

          echo "Timed out waiting for deployment. Check Systems Manager command history."
          exit 1
